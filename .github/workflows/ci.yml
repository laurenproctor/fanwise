name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token every job receives can read the repository and nothing else. No job
# here pushes, comments, publishes or approves, so nothing is granted beyond
# this. A job that one day needs more declares it on that job, not here.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Placeholders only. They exist so lib/env.ts validation passes in the jobs that
# never talk to Supabase; the URL has to parse as a URL and the keys have to be
# non-empty, nothing more. The jobs that do talk to Supabase overwrite all three
# from the running stack, so nothing here is ever a real credential and the ports
# are never assumed.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3399
  # The containers `supabase start` is told not to run. The suites talk to
  # Postgres, the API gateway, PostgREST, Auth and Storage and nothing else:
  # no mail is read (signups are auto-confirmed and the e2e email-change test
  # asserts both outcomes), no image is transformed through the storage
  # proxy, and there are no edge functions, realtime channels or log
  # pipelines. Each excluded image is one the runner would otherwise pull
  # cold on every run; together they were more than half of a ~100 s start.
  #
  # The names are the ones CLI 2.101.0 (pinned below) accepts, and they are
  # not the ones its `--help` prints: `inbucket` is `mailpit`, `analytics` is
  # `logflare`, `meta` is `postgres-meta`. A name the CLI does not know is a
  # warning, not an error, and the container starts anyway, so a wrong name
  # here costs time silently. Check the start step's log after bumping the CLI.
  SUPABASE_EXCLUDE: edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,studio,supavisor,vector

# Every third-party action is pinned to the full commit of a published release,
# with the release named beside it. A tag can be moved; a commit cannot. The
# pin is what runs, the comment is what a person reads, and Dependabot keeps
# the two together when it proposes an update (.github/dependabot.yml).
# tests/unit/workflows.test.ts refuses a tag-only reference.
#
# Checkout never persists its token into the working tree: no job pushes, so
# no job's build steps should be able to.
#
# The three jobs are independent and start together. Until 24 September 2026
# e2e waited for verify and tenancy to finish first, which put the slowest job
# at the end of the slowest chain and made every run about twelve minutes;
# nothing in e2e uses either job's output (it builds the app itself), so the
# wait bought nothing but a shorter bill on the runs that fail early. All three
# are required checks on main (the repository ruleset names them), so a red
# verify still blocks the merge whether or not e2e ran.
#
# Neither database job stops its stack at the end. The runner is discarded
# with everything on it, and `supabase stop` was twenty seconds on the
# critical path of each.

jobs:
  # Static checks and unit tests. No database, so this stays fast and is the
  # first thing to fail on an ordinary mistake.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version here on purpose. pnpm/action-setup refuses when the version
      # is given both here and as packageManager in package.json, so
      # package.json is the single source of truth.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # Tenancy. Needs a real Postgres, a real Auth server and real JWTs, so it runs
  # against a local Supabase stack rather than a bare postgres service container.
  # Added at step A1, which is the first step with tenant tables to isolate.
  tenancy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.101.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x "$SUPABASE_EXCLUDE"
      - run: supabase db reset
      - name: Point the suite at the running stack
        run: .github/scripts/export-supabase-env.sh
      # docs/testing.md: a failing tenancy test is fixed or reported, never
      # skipped. Do not add continue-on-error to this step.
      - run: pnpm test:db

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.101.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Journeys 1 and 9 sign real users up, so the auth server has to be live.
      - run: supabase start -x "$SUPABASE_EXCLUDE"
      - run: supabase db reset
      - name: Point the suite at the running stack
        run: .github/scripts/export-supabase-env.sh
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
