name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token every job receives can read the repository and nothing else. No job
# here pushes, comments, publishes or approves, so nothing is granted beyond
# this. A job that one day needs more declares it on that job, not here.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Placeholders only. They exist so lib/env.ts validation passes in the jobs that
# never talk to Supabase; the URL has to parse as a URL and the keys have to be
# non-empty, nothing more. The jobs that do talk to Supabase overwrite all three
# from the running stack, so nothing here is ever a real credential and the ports
# are never assumed.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3399

# Every third-party action is pinned to the full commit of a published release,
# with the release named beside it. A tag can be moved; a commit cannot. The
# pin is what runs, the comment is what a person reads, and Dependabot keeps
# the two together when it proposes an update (.github/dependabot.yml).
# tests/unit/workflows.test.ts refuses a tag-only reference.
#
# Checkout never persists its token into the working tree: no job pushes, so
# no job's build steps should be able to.

jobs:
  # Static checks and unit tests. No database, so this stays fast and is the
  # first thing to fail on an ordinary mistake.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No version here on purpose. pnpm/action-setup refuses when the version
      # is given both here and as packageManager in package.json, so
      # package.json is the single source of truth.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # Tenancy. Needs a real Postgres, a real Auth server and real JWTs, so it runs
  # against a local Supabase stack rather than a bare postgres service container.
  # Added at step A1, which is the first step with tenant tables to isolate.
  tenancy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.101.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase db reset
      - name: Point the suite at the running stack
        run: .github/scripts/export-supabase-env.sh
      # docs/testing.md: a failing tenancy test is fixed or reported, never
      # skipped. Do not add continue-on-error to this step.
      - run: pnpm test:db
      - if: ${{ always() }}
        run: supabase stop

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [verify, tenancy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.101.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Journeys 1 and 9 sign real users up, so the auth server has to be live.
      - run: supabase start
      - run: supabase db reset
      - name: Point the suite at the running stack
        run: .github/scripts/export-supabase-env.sh
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: ${{ always() }}
        run: supabase stop
