project_id = "fanwise"

[api]
enabled = true
port = 54421
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 15

[studio]
enabled = true
port = 54423

[inbucket]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "4GiB"

[auth]
enabled = true
site_url = "http://localhost:3001"
# Recovery links land on /auth/confirm. The ports vary by how the app is being
# run (3000 by default, 3001 for this stack, a dedicated port for Playwright),
# so the local allowlist is a glob. A deployed project lists exact URLs.
additional_redirect_urls = [
  "http://localhost:3001/auth/callback",
  "http://localhost:*/auth/confirm",
  "http://127.0.0.1:*/auth/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.email.template.recovery]
subject = "Reset your Fanwise password"
content_path = "./supabase/templates/recovery.html"

[analytics]
enabled = true
port = 54427

# --- Hosted project overrides -----------------------------------------------
# Everything above describes the local stack. `supabase config push` applies
# this file to a hosted project, and the block below is what changes when the
# target is production. The CLI selects it by matching `project_id` against the
# ref it is pushing to. A local `supabase start` never reads it, and the env()
# references below stay unresolved locally without error (checked against CLI
# 2.101.0, the version CI pins).
#
# Push with `pnpm auth:push`, never `supabase config push` by hand. The script
# refuses to run until every SMTP variable is set, because pushing this block
# half-filled would enable SMTP with an empty host and stop every auth email,
# and Supabase's built-in provider rejects the custom recovery template anyway
# (docs/decisions/0006-transactional-email.md).
[remotes.production]
project_id = "whepzmlbhhuxjswezall"

[remotes.production.auth]
site_url = "https://fanwise.vercel.app"
additional_redirect_urls = ["https://fanwise.vercel.app/**"]

# Wired, not yet on. The provider is Resend (ADR 0006). Turning it on is:
# verify a sending subdomain there, put the four values in .env.local, run
# `pnpm auth:push`.
# The push installs the custom recovery template in the same call, which is
# what makes cross-device password reset work on the hosted project.
#
# The port is pinned rather than read from the environment because env()
# substitutes strings and this field is an integer. 587 is STARTTLS, which
# Resend's relay accepts; a provider that wants 465 needs this line edited.
[remotes.production.auth.email.smtp]
enabled = true
host = "env(SMTP_HOST)"
port = 587
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "env(SMTP_ADMIN_EMAIL)"
sender_name = "Fanwise"
